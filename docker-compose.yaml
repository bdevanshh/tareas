name: tareas

# Container-only overrides for the single root .env (which keeps localhost
# defaults for host development). Everything else comes from .env.
x-docker-overrides: &docker-overrides
  # Container-only overrides for the single root .env (which keeps
  # localhost defaults for host development).
  TAREAS_DATABASE.HOST: postgres
  TAREAS_REDIS.ADDRESS: redis:6379
  TAREAS_AWS.ENDPOINT_URL: http://seaweedfs:8333

x-backend-build: &backend-build
  context: ./apps/backend
  dockerfile: Dockerfile
  target: dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: tareas
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tareas"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Free, S3-compatible object storage. Replaces LocalStack, whose free tier
  # no longer covers this use case.
  seaweedfs:
    image: chrislusf/seaweedfs:4.54
    command: mini -dir=/data -bucket=tareas-todo-attachments
    environment:
      # SeaweedFS creates a matching admin identity from these variables.
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    ports:
      - "8333:8333" # S3 API
      - "8888:8888" # Filer UI
      - "9333:9333" # Master UI
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8333"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  migrate:
    build: *backend-build
    image: tareas-backend:dev
    environment: *docker-overrides
    command: go run ./cmd/migrate
    volumes:
      - ./apps/backend:/app
      - go-build-cache:/root/.cache/go-build
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build: *backend-build
    image: tareas-backend:dev
    environment: *docker-overrides
    command: air -c .air.toml
    ports:
      - "3001:3001"
    volumes:
      - ./apps/backend:/app
      - go-build-cache:/root/.cache/go-build
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3001/status >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  cron:
    build: *backend-build
    image: tareas-backend:dev
    environment: *docker-overrides
    command: go run ./cmd/cron
    ports:
      - "8080:8080"
    volumes:
      - ./apps/backend:/app
      - go-build-cache:/root/.cache/go-build
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      target: dev
    image: tareas-frontend:dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      # Keep container-installed dependencies instead of the host's.
      - frontend-root-node-modules:/app/node_modules
      - frontend-app-node-modules:/app/apps/frontend/node_modules
      - zod-node-modules:/app/packages/zod/node_modules
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://localhost:3000').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  seaweedfs-data:
  go-build-cache:
  frontend-root-node-modules:
  frontend-app-node-modules:
  zod-node-modules:
