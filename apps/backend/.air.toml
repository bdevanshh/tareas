root = "."
tmp_dir = ".output"

[build]
  cmd = "go build -o ./.output/tareas ./cmd/tareas"
  entrypoint = "./.output/tareas"
  include_ext = ["go", "tpl", "tmpl", "html", "sql"]
  exclude_dir = [".output", "vendor"]
  delay = 1000
  stop_on_error = true

[log]
  time = true

[misc]
  clean_on_exit = true
