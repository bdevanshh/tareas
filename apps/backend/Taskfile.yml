version: "3"

tasks:
  build:
    desc: build the backend binary (via Docker)
    cmds:
      - docker compose -f ../../docker-compose.yaml run --rm --no-deps backend sh -c 'go build -o /tmp/tareas ./cmd/tareas'

  lint:
    desc: run go vet (via Docker)
    cmds:
      - docker compose -f ../../docker-compose.yaml run --rm --no-deps backend sh -c 'go vet ./...'

  check-types:
    desc: type-check the backend (via Docker)
    cmds:
      - docker compose -f ../../docker-compose.yaml run --rm --no-deps backend sh -c 'go build ./...'

  format:
    desc: format Go source (via Docker)
    cmds:
      - docker compose -f ../../docker-compose.yaml run --rm --no-deps backend sh -c 'gofmt -w .'

  test:
    desc: run all tests (via Docker)
    cmds:
      - docker compose -f ../../docker-compose.yaml run --rm --no-deps -v /var/run/docker.sock:/var/run/docker.sock backend sh -c 'go test ./...'

  run:
    desc: run the backend application
    cmds:
      - docker compose -f ../../docker-compose.yaml up backend

  migrations:new:
    desc: create a new database migration
    vars:
      NAME: '{{.name | default ""}}'
    cmds:
      - |
        if [ -z "{{.NAME}}" ]; then
          echo "Error: name parameter is required"
          echo "Usage: task migrations:new name=migration_name"
          exit 1
        fi
      - echo 'Creating migration file for {{.NAME}}...'
      - docker run --rm -v "$(pwd)/internal/database/migrations:/migrations" migrate/migrate create -ext sql -dir /migrations -seq {{.NAME}}
    silent: true

  migrate:
    desc: apply pending migrations
    cmds:
      - docker compose -f ../../docker-compose.yaml run --rm migrate
