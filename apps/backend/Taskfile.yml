version: "3"

tasks:
  build:
    desc: build the backend binary
    cmds:
      - go build -o ./tmp/tareas ./cmd/tareas

  lint:
    desc: run go vet
    cmds:
      - go vet ./...

  test:
    desc: run all tests
    cmds:
      - go test -v ./...

  run:
    desc: run the backend application
    cmds:
      - go run ./cmd/tareas

  migrations:new:
    desc: create a new database migration (via Docker, no local migrate binary needed)
    vars:
      NAME: '{{.name | default ""}}'
    cmds:
      - |
        if [ -z "{{.NAME}}" ]; then
          echo "Error: name parameter is required"
          echo "Usage: task migrations:new name=migration_name"
          exit 1
        fi
      - echo 'Creating migration file for {{.NAME}}...'
      - docker run --rm -v "$(pwd)/internal/database/migrations:/migrations" migrate/migrate create -ext sql -dir /migrations -seq {{.NAME}}
    silent: true

  migrate:
    desc: apply pending migrations (via Docker)
    cmds:
      - docker compose -f ../../docker-compose.yaml run --rm migrate
